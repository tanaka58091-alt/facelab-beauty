<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顔ヨガ種目カタログ｜FaceLab Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{ padding:24px 16px 80px; }
  .cat-wrap{ max-width:1100px; margin:0 auto; }
  .cat-head{ text-align:center; margin-bottom:22px; }
  .cat-head h1{ font-family:'Zen Maru Gothic',sans-serif; font-size:26px; margin:0 0 8px; color:var(--ink); }
  .cat-head p{ color:var(--ink-2); font-size:14px; margin:0; }
  .cat-stats{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:16px 0 26px; }
  .stat{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:10px 18px; text-align:center; box-shadow:var(--shadow-sm); }
  .stat b{ display:block; font-family:'Inter',sans-serif; font-size:22px; color:var(--brand); line-height:1.2; }
  .stat span{ font-size:11px; color:var(--muted); }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:26px; }
  .fbtn{ border:1px solid var(--border); background:#fff; color:var(--ink-2); border-radius:20px; padding:7px 15px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .fbtn.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .grp-title{ font-family:'Zen Maru Gothic',sans-serif; font-size:17px; border-left:5px solid var(--brand); padding-left:12px; margin:30px 0 14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .card-top{ display:flex; gap:10px; align-items:flex-start; }
  .card-ico{ width:56px; height:56px; flex-shrink:0; background:var(--brand-soft); border-radius:12px; padding:3px; }
  .card-ico svg{ width:100%; height:100%; }
  .card-name{ font-weight:700; font-size:14px; color:var(--ink); line-height:1.4; }
  .tag{ display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:12px; margin-top:4px; }
  .tag.train{ background:#FFE5EC; color:#E07A8A; }
  .tag.relax{ background:#E3F5EA; color:#2E9E5B; }
  .card-purpose{ font-size:12px; color:var(--muted); line-height:1.6; margin-top:8px; }
  .card-meta{ font-size:11px; color:var(--muted); margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .card-open{ font-size:11.5px; color:var(--brand); font-weight:700; margin-top:8px; }
  /* モーダル */
  .cat-modal{ position:fixed; inset:0; background:rgba(43,27,34,.55); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .cat-modal[hidden]{ display:none; }
  .cat-inner{ background:var(--bg-2); border-radius:20px; max-width:900px; width:100%; padding:26px; position:relative; margin:auto; }
  .cat-close{ position:absolute; top:14px; right:14px; border:none; background:var(--brand-soft); color:var(--brand); width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; font-weight:700; }
  .pair-note{ background:#FFF8E6; border:1px solid #FFE1A8; border-radius:10px; padding:9px 13px; font-size:12px; color:#7A5A12; margin:12px 0 0; }
  .how-list{ font-size:14px; color:var(--ink-2); line-height:1.9; padding-left:22px; }
  .how-list li{ margin:4px 0; }
</style>
</head>
<body>
<div class="cat-wrap">
  <div class="cat-head">
    <h1 id="cat-title">顔ヨガ 種目カタログ</h1>
    <p>カードをクリックすると、手順イラストと文章が開きます。<br>絵の番号と文章の番号は必ず一致しています（①の絵＝①の文）。</p>
    <div class="cat-stats" id="stats"></div>
  </div>
  <div class="filters" id="filters"></div>
  <div id="groups"></div>
</div>

<div class="cat-modal" id="modal" hidden>
  <div class="cat-inner">
    <button class="cat-close" id="close" aria-label="閉じる">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import { EXERCISES, getMeta, TOOLS_LABEL, CONTRA_LABEL, TIME_OF_DAY_LABEL } from './exercises.js';
import { buildStepPanelsHTML, buildHowListHTML, MOTION_DEFS, getMotion } from './motion.js';

const GROUP_DEFS = [
  { key:'brow',  title:'額・眉間', ids:['browRaise','browUpDown','foreheadSmooth','glabellaRelease','hairlineLift','browSolo',
        'browInnerLift','foreheadHold','browBonePress','foreheadTap','scalpRelease'] },
  { key:'eye',   title:'目', ids:['eyeWideOpen','binocularPose','lowerLidLift','outerEyeLift','munchFace','eyeRelease','eyeRoll','blinkReset',
        'focusShift','upperLidHold','squintHold','eyeSqueeze','orbitPress','palming','eyeFigure8'] },
  { key:'cheek', title:'頬', ids:['cheekLift','cheekLiftAssist','cheekPump','balloonFace','cheekAir','cheekBoneMassage','nasolabialStretch','fishFace',
        'cheekBoneLift','cheekResist','smileSquint','cheekTongueSweep','midfaceLift','cheekHoldOne','noseCare'] },
  { key:'mouth', title:'口・唇・鼻の下', ids:['mouthCornerLift','mouthCornerTongue','aiueoTrain','chopstickTrain','beakPose','upperLipTrain','lipOpenClose','lipPucker','lipRelease','bigO',
        'cornerDepressorRelease','strawPose','lipRollIn','whistlePose','mouthWideI','lipCornerPull','lipUpDownAir'] },
  { key:'tongue',title:'舌', ids:['tongueRoll','tonguePress','tongueOut','tongueStretch','lionPose','swallowTrain',
        'tongueUpHold','tongueSidePush','tongueGumTrace','tongueDownPress'] },
  { key:'chin',  title:'あご・フェイスライン', ids:['chinTuck','chinPress','chinMassage','jawSlide','mouthOpen','octopusPose','chinUpPose',
        'chinKissUp','jawResist','submentalPush','jawLineTrace','chinSideTuck'] },
  { key:'jaw',   title:'エラ・こめかみ', ids:['masseterRelease','masseterTap','templeRelease','masseterStretch',
        'earYoga','oneSideRelease','masseterDeep','templeCircle','jawDrop','innerCheekRelease'] },
  { key:'neck',  title:'首・肩・姿勢', ids:['neckFront','neckSide','neckBack','neckDiagonal','neckIso','neckMassage','clavicleLymph','shoulderRoll',
        'chestOpen','scapulaSqueeze','sternoRelease','wallPosture','headSlideBack','parotidDrain'] },
  { key:'whole', title:'全体・呼吸・リラックス・左右差', ids:['fullFlow','faceRelax','breathGlow','diaphragmBreath','bloodFlowPose','freshFacePose','faceMassage','postureFace','symmetrySmile','oneSideSmile','smileHold',
        'faceLymphDrain','acupressure','noseBreathTrain','faceTapAll','nightReset'] },
];
// 未分類の取りこぼしを出さない安全網。種目を足しても一覧から漏れない。
const LISTED = new Set(GROUP_DEFS.flatMap(g => g.ids));
const UNLISTED = Object.keys(EXERCISES).filter(id => !LISTED.has(id));
const GROUPS = [
  ...GROUP_DEFS.map(g => ({ ...g, ids: g.ids.filter(id => EXERCISES[id]) })),
  ...(UNLISTED.length ? [{ key:'other', title:'その他', ids: UNLISTED }] : []),
].map(g => ({ ...g, title: `${g.title}（${g.ids.length}種）` }));

// 統計
const all = Object.keys(EXERCISES);
const relax = all.filter(i => EXERCISES[i].kind === 'stretch').length;
const panels = all.reduce((a,id)=>a+getMotion(id).steps.length,0);
document.getElementById('stats').innerHTML = `
  <div class="stat"><b>${all.length}</b><span>種目</span></div>
  <div class="stat"><b>${all.length-relax}</b><span>鍛える</span></div>
  <div class="stat"><b>${relax}</b><span>ゆるめる</span></div>
  <div class="stat"><b>${panels}</b><span>手順イラスト</span></div>
  <div class="stat"><b>${GROUPS.length}</b><span>部位</span></div>`;
// 見出しの種目数もデータから出す（数字の書き忘れで実態とズレないように）
document.getElementById('cat-title').textContent = `顔ヨガ ${all.length}種 カタログ`;
document.title = `顔ヨガ${all.length}種 カタログ｜FaceLab Beauty`;

// フィルタ
let filter = 'all';
const FILTERS = [ {k:'all',l:'すべて'}, {k:'training',l:'💪 鍛える'}, {k:'stretch',l:'🌿 ゆるめる'} ];
document.getElementById('filters').innerHTML = FILTERS.map(f=>`<button class="fbtn${f.k==='all'?' active':''}" data-f="${f.k}">${f.l}</button>`).join('');
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('active', x===b));
  render();
});

function card(id){
  const e = EXERCISES[id], m = getMeta(id);
  const tools = (m.tools||[]).filter(t=>t!=='none').map(t=>TOOLS_LABEL[t]||t);
  const tod = (m.timeOfDay||[]).filter(t=>t!=='any').map(t=>TIME_OF_DAY_LABEL[t]||t);
  return `<div class="card" data-ex="${id}">
    <div class="card-top">
      <div class="card-ico">${e.illustration}</div>
      <div>
        <div class="card-name">${e.name}</div>
        <span class="tag ${e.kind==='stretch'?'relax':'train'}">${e.kind==='stretch'?'🌿 ゆるめる':'💪 鍛える'}</span>
      </div>
    </div>
    <div class="card-purpose">${e.purpose}</div>
    <div class="card-meta"><span>⏱ ${e.duration}</span>${tools.length?`<span>🛠 ${tools.join('・')}</span>`:''}${tod.length?`<span>${tod.join('')}</span>`:''}</div>
    <div class="card-open">▶ 手順を見る</div>
  </div>`;
}

function render(){
  document.getElementById('groups').innerHTML = GROUPS.map(g=>{
    const ids = g.ids.filter(id => filter==='all' || EXERCISES[id].kind===(filter==='stretch'?'stretch':'training'));
    if(!ids.length) return '';
    return `<h2 class="grp-title">${g.title}</h2><div class="grid">${ids.map(card).join('')}</div>`;
  }).join('');
}
render();

// 詳細モーダル（クリック時に手順パネルを生成＝軽量）
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
document.getElementById('groups').addEventListener('click', e => {
  const c = e.target.closest('.card'); if(!c) return;
  const id = c.dataset.ex, ex = EXERCISES[id], m = getMeta(id), mo = getMotion(id);
  const contra = (m.contra||[]).map(x=>CONTRA_LABEL[x]||x);
  modalBody.innerHTML = `
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">${MOTION_DEFS}</svg>
    <span class="tag ${ex.kind==='stretch'?'relax':'train'}">${ex.kind==='stretch'?'🌿 ゆるめる':'💪 鍛える'}</span>
    <h2 style="margin:8px 0 4px; font-size:22px">${ex.name}</h2>
    <div class="ex-meta"><span><strong>所要</strong> ${ex.duration}</span><span><strong>道具</strong> ${ex.equipment}</span></div>
    <p style="font-size:14px; color:var(--ink-2); margin:10px 0 0">${ex.purpose}</p>
    ${m.warning?`<div class="ex-warning" style="margin-top:12px">⚠️ <strong>注意:</strong> ${m.warning}</div>`:''}
    ${contra.length?`<div class="ex-contra-row" style="margin-top:8px"><span class="ex-contra-label">こんな方は控えて:</span>${contra.map(c=>`<span class="meta-chip contra">⚠ ${c}</span>`).join('')}</div>`:''}
    <div class="modal-section">
      <h4>🎬 やり方（絵で見る）</h4>
      ${buildStepPanelsHTML(id)}
    </div>
    <div class="modal-section">
      <h4>📋 やり方（文章で読む）</h4>
      <p class="modal-section-sub">番号は上のイラストと対応しています。①の絵＝①の文です。</p>
      ${buildHowListHTML(id)}
      <div class="pair-note">絵 ${mo.steps.length}枚 ＝ 文 ${mo.steps.length}項目（必ず一致します）</div>
    </div>
    <div class="modal-section">
      <h4>✨ コツ</h4>
      <div class="modal-cues">
        <div class="cue-box do"><strong>✅ こうする</strong>${ex.cues.do}</div>
        <div class="cue-box dont"><strong>❌ これはNG</strong>${ex.cues.dont}</div>
      </div>
    </div>
    <div class="modal-section"><h4>🎯 どこに効く？</h4><ul>${ex.targets.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="modal-section"><h4>💡 なぜ効くの？</h4><p>${ex.why}</p></div>`;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  modal.scrollTop = 0;
});
function close(){ modal.hidden = true; document.body.style.overflow=''; modalBody.innerHTML=''; }
document.getElementById('close').addEventListener('click', close);
modal.addEventListener('click', e => { if(e.target===modal) close(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !modal.hidden) close(); });
</script>
</body>
</html>
